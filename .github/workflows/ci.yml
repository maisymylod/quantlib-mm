name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  api:
    name: API imports and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e .
          pip install -r api/requirements.txt
      - name: Every router imports
        run: python -c "import api.main"
      - name: App exposes its routes
        run: |
          python - <<'PY'
          from api.main import app
          paths = {r.path for r in app.routes}
          expected = {
              "/api/correlation/analyze",
              "/api/montecarlo/simulate",
              "/api/options/black-scholes",
              "/api/options/binomial",
              "/api/options/monte-carlo",
              "/api/portfolio/efficient-frontier",
              "/api/risk/metrics",
              "/api/timeseries/analyze",
              "/api/yield-curve/build",
              "/healthz",
          }
          missing = sorted(expected - paths)
          assert not missing, f"routes missing from the app: {missing}"
          print(f"{len(paths)} routes registered")
          PY

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
